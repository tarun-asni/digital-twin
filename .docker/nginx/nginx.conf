events {}
 
http {

    client_max_body_size 20M;
	
	map "$ssl_client_verify|$remote_addr" $allow_request {
        # Default: deny
        default 0;

        # Localhost always allowed
        "~^.*\|127\.0\.0\.1$" 1;
        
        # Docker internal IPs
        "~^.*\|172\." 1;

        # Tailscale IPs (start with 100.)
        "~^.*\|100\." 1;

        # Clients with valid SSL cert
        "~^SUCCESS\|.*" 1;
    }
	
	server {
        listen 80;
        server_name 100.* *.tail9bebbc.ts.net localhost;

        location / {
            return 302 /trust.html;
        }

        location = /trust.html {
            alias /etc/nginx/trust.html;
        }

        location = /rootCA.pem {
            alias /etc/nginx/certs/rootCA.pem;
            default_type application/x-x509-ca-cert;
        }
    }
	
	
    server {
        listen 443 ssl;
		server_name 100.* *.tail9bebbc.ts.net localhost;
 
        ssl_certificate           /etc/nginx/certs/fullchain.pem;
		ssl_certificate_key       /etc/nginx/certs/nginx_cert_key.pem;
 
		# Trusted CA for verifying client certs
		ssl_client_certificate    /etc/nginx/certs/rootCA.pem;
		ssl_verify_client         optional;
 
 
		location / {
            proxy_pass http://digital-twin-frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
		
        # --- Backend APIs ---
        location /provision/ {
            if ($allow_request = 0) {
                return 403;
            }

            proxy_pass http://provisioning-server:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Client-Cert $ssl_client_cert;
        }

        location /device_order {
			if ($allow_request = 0) {
                return 403;
            }

            proxy_pass http://provisioning-server:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Client-Cert $ssl_client_cert;
		}

        location /command-center/ {
            if ($allow_request = 0) {
                return 403;
            }

            proxy_pass http://command-center-web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Client-Cert $ssl_client_cert;
        }

        location /media/ {
            proxy_pass http://command-center-web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws/ {
            proxy_pass http://websocket-server:8001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}