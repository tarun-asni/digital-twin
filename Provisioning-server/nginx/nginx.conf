events {}

http {
    server {
        listen 443 ssl;

        ssl_certificate /etc/nginx/certs/rootCA.pem;
        ssl_certificate_key /etc/nginx/certs/rootCA.key;

        ssl_client_certificate /etc/nginx/certs/rootCA.pem;
        ssl_verify_client optional;

        # CRL file must include PEM‑encoded CRLs for each CA in the chain
        ssl_crl C:/nginx-1.28.0/etc/nginx/crl/combined.crl.pem;

        location / {
            proxy_pass http://app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
