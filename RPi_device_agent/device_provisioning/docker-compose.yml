version: '3.8'

services:
  app:
    build: .
    container_name: provisioning_server
    env_file: .env
    volumes:
      - ./certs:/app/certs
    depends_on:
      - pgdb
    expose:
      - "5000"
    networks:
      - backend

  pgdb:
    image: postgres:13
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - backend
      
volumes:
  pgdata:

networks:
  backend:
    driver: bridge
